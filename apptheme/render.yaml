# دیپلوی رایگان روی render.com — فقط این فایل + گیت‌هاب کافیه
services:
  - type: web
    name: apptheme
    runtime: node
    plan: free
    buildCommand: echo "بدون نیاز به بیلد — صفر وابستگی"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: SITE_URL        # بعد از ساخت، آدرس واقعی را بگذارید: https://apptheme.onrender.com
        sync: false
      - key: NODE_VERSION
        value: "20"
      # ── ماندگاری داده‌ها روی پلن رایگان (دیسک موقت!) — اختیاری ولی به‌شدت توصیه‌شده ──
      - key: DB_SYNC_REPO      # مثل: myuser/apptheme-data (ریپوی خصوصی برای دیتابیس)
        sync: false
      - key: DB_SYNC_TOKEN     # توکن گیت‌هاب با دسترسی Contents: Read and Write
        sync: false
