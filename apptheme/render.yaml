# اپ‌تم — Render Blueprint
# Repository layout: /render.yaml + /apptheme/*
services:
  - type: web
    name: apptheme
    runtime: docker
    plan: free
    rootDir: ./apptheme
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SITE_URL
        sync: false
      - key: NODE_VERSION
        value: "20"
      # برای نگهداری DB روی دیسک موقت Render رایگان (اختیاری)
      - key: DB_SYNC_REPO
        sync: false
      - key: DB_SYNC_TOKEN
        sync: false
